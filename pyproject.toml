[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "bgblur-ai"
version = "0.1.0"
description = "Python SDK for the BGBlur API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "BGBlur" }
]
keywords = ["bgblur", "bgblur-ai", "sdk", "image", "video", "blur", "anonymization"]
dependencies = [
  "httpx>=0.27,<1.0",
  "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
bgblur-ai = "bgblur_ai.cli:main"

[tool.hatch.build]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bgblur_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
